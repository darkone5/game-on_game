<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2-Player Treasure Hunt</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    h1 { margin-bottom: 5px; color: #ffd700; }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 1000px;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .p1-color { color: #00d2ff; }
    .p2-color { color: #00ff88; }
    canvas {
      border: 4px solid #444;
      background-color: #2b261f;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }
    .controls {
      margin-top: 15px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <h1>🏴‍☠️ 2-Player Treasure Hunt</h1>
  
  <div class="hud">
    <div class="p1-color">
      Player 1 (WASD)<br>
      Score: <span id="p1-score">0</span> | HP: <span id="p1-hp">100</span> | Lives: <span id="p1-lives">3</span>
    </div>
    <div>Level: <span id="level-display">1</span> / 3</div>
    <div class="p2-color" style="text-align: right;">
      Player 2 (Arrows)<br>
      Score: <span id="p2-score">0</span> | HP: <span id="p2-hp">100</span> | Lives: <span id="p2-lives">3</span>
    </div>
  </div>

  <canvas id="gameCanvas" width="1000" height="650"></canvas>

  <div class="controls">
    P1: <b>W, A, S, D</b> to move | P2: <b>Arrow Keys</b> to move
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Audio Context Setup
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    // Input state
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
    });
    window.addEventListener('keyup', e => keys[e.key] = false);

    // Game state variables
    let currentLevel = 1;
    let treasures = [];
    let traps = [];
    let staticObstacles = [];

    // Player class with 2-second freeze and 5-second protection
    class Player {
      constructor(x, y, color, controls) {
        this.startX = x;
        this.startY = y;
        this.x = x;
        this.y = y;
        this.size = 26;
        this.color = color;
        this.speed = 4.5;
        this.score = 0;
        this.hp = 100;
        this.lives = 3;
        this.controls = controls;
        this.freezeEndTime = Date.now() + 2000;   // 2 seconds movement freeze
        this.protectEndTime = Date.now() + 5000;  // 5 seconds invincibility
      }

      resetPos() {
        this.x = this.startX;
        this.y = this.startY;
        this.freezeEndTime = Date.now() + 2000;
        this.protectEndTime = Date.now() + 5000;
      }

      fullReset() {
        this.score = 0;
        this.hp = 100;
        this.lives = 3;
        this.resetPos();
      }

      update() {
        const now = Date.now();
        this.isProtected = now < this.protectEndTime;

        // If movement is frozen for the first 2 seconds, ignore inputs completely
        if (now < this.freezeEndTime) {
          return; 
        }

        let dx = 0;
        let dy = 0;

        if (keys[this.controls.up]) dy -= this.speed;
        if (keys[this.controls.down]) dy += this.speed;
        if (keys[this.controls.left]) dx -= this.speed;
        if (keys[this.controls.right]) dx += this.speed;

        if (dx !== 0 || dy !== 0) {
          this.x += dx;
          if (this.x < 0 || this.x > canvas.width - this.size || checkShapeCollision(this.x, this.y, this.size, this.size)) {
            this.x -= dx;
          }

          this.y += dy;
          if (this.y < 0 || this.y > canvas.height - this.size || checkShapeCollision(this.x, this.y, this.size, this.size)) {
            this.y -= dy;
          }
        }
      }

      draw() {
        const now = Date.now();
        // Flash white while protected
        if (now < this.protectEndTime && Math.floor(now / 150) % 2 === 0) {
          ctx.fillStyle = '#ffffff'; 
        } else {
          ctx.fillStyle = this.color;
        }

        ctx.beginPath();
        ctx.arc(this.x + this.size/2, this.y + this.size/2, this.size/2, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        // Draw protective shield aura if active
        if (now < this.protectEndTime) {
          ctx.strokeStyle = '#00ffff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(this.x + this.size/2, this.y + this.size/2, this.size/2 + 4, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    }

    const p1 = new Player(100, 312, '#00d2ff', { up: 'w', down: 's', left: 'a', right: 'd' });
    const p2 = new Player(870, 312, '#00ff88', { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' });

    function checkShapeCollision(x, y, w, h) {
      for (let obs of staticObstacles) {
        if (obs.type === 'rect') {
          if (x < obs.x + obs.size && x + w > obs.x &&
              y < obs.y + obs.size && y + h > obs.y) {
            return true;
          }
        } else if (obs.type === 'circle') {
          const cX = obs.x + obs.size/2;
          const cY = obs.y + obs.size/2;
          const cRadius = obs.size/2;
          const closestX = Math.max(x, Math.min(cX, x + w));
          const closestY = Math.max(y, Math.min(cY, y + h));
          const dx = cX - closestX;
          const dy = cY - closestY;
          if ((dx * dx + dy * dy) < (cRadius * cRadius)) {
            return true;
          }
        } else if (obs.type === 'triangle') {
          if (x < obs.x + obs.size && x + w > obs.x &&
              y < obs.y + obs.size && y + h > obs.y) {
            return true;
          }
        }
      }
      return false;
    }

    function initLevel(lvl) {
      currentLevel = lvl;
      document.getElementById('level-display').innerText = currentLevel;
      p1.resetPos();
      p2.resetPos();

      // 1. Generate static obstacles with safe buffer zone around player spawns
      staticObstacles = [];
      const obstacleCount = 3 + lvl * 2;
      const shapes = ['rect', 'circle', 'triangle'];

      for (let i = 0; i < obstacleCount; i++) {
        let obsX, obsY, obsSize, shape, overlapping;
        let attempts = 0;
        do {
          shape = shapes[Math.floor(Math.random() * shapes.length)];
          obsSize = Math.random() * 30 + 25;
          obsX = Math.random() * (canvas.width - 150) + 75;
          obsY = Math.random() * (canvas.height - 150) + 50;

          const p1Buffer = (obsX < 100 + 60 && obsX + obsSize > 100 - 60 && obsY < 312 + 60 && obsY + obsSize > 312 - 60);
          const p2Buffer = (obsX < 870 + 60 && obsX + obsSize > 870 - 60 && obsY < 312 + 60 && obsY + obsSize > 312 - 60);

          overlapping = p1Buffer || p2Buffer;
          attempts++;
          if (attempts > 500) break;
        } while (overlapping);

        staticObstacles.push({
          type: shape,
          x: obsX,
          y: obsY,
          size: obsSize
        });
      }

      // 2. Generate varied treasures with +10 coins per level scaling (Level 1: 10, Level 2: 20, Level 3: 30)
      treasures = [];
      const treasureCount = 10 + (lvl - 1) * 10; 

      for (let i = 0; i < treasureCount; i++) {
        let tX, tY, overlapping;
        let attempts = 0;

        const rand = Math.random();
        let tColor, tPoints, tRadius;
        if (rand < 0.6) {
          tColor = '#ffd700'; // Gold (10 pts)
          tPoints = 10;
          tRadius = 8;
        } else if (rand < 0.85) {
          tColor = '#00d2ff'; // Blue (20 pts)
          tPoints = 20;
          tRadius = 10;
        } else {
          tColor = '#ff4d4d'; // Red (50 pts)
          tPoints = 50;
          tRadius = 12;
        }

        do {
          tX = Math.random() * (canvas.width - 60) + 30;
          tY = Math.random() * (canvas.height - 60) + 30;
          overlapping = checkShapeCollision(tX - tRadius, tY - tRadius, tRadius * 2, tRadius * 2);
          attempts++;
          if (attempts > 500) break; 
        } while (overlapping);

        treasures.push({
          x: tX,
          y: tY,
          radius: tRadius,
          points: tPoints,
          color: tColor
        });
      }

      // 3. Moving Traps / Enemies
      traps = [];
      if (lvl === 2) {
        for (let i = 0; i < 4; i++) {
          traps.push({
            x: Math.random() * (canvas.width - 80) + 40,
            y: Math.random() * (canvas.height - 80) + 40,
            vx: (Math.random() - 0.5) * 3,
            vy: (Math.random() - 0.5) * 3,
            size: 20
          });
        }
      } else if (lvl === 3) {
        for (let i = 0; i < 8; i++) {
          traps.push({
            x: Math.random() * (canvas.width - 80) + 40,
            y: Math.random() * (canvas.height - 80) + 40,
            vx: (Math.random() - 0.5) * 4.5,
            vy: (Math.random() - 0.5) * 4.5,
            size: 22
          });
        }
      }
    }

    function checkCollision(circle1, circle2) {
      const dx = (circle1.x + (circle1.size ? circle1.size/2 : 0)) - circle2.x;
      const dy = (circle1.y + (circle1.size ? circle1.size/2 : 0)) - circle2.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      const r1 = circle1.size ? circle1.size/2 : circle1.radius;
      const r2 = circle2.size ? circle2.size/2 : circle2.radius;
      return distance < (r1 + r2);
    }

    function handlePlayerDeath(player, name) {
      player.lives--;
      playSound(100, 0.1);
      if (player.lives > 0) {
        alert(`${name} lost a life! Lives remaining: ${player.lives}`);
        player.hp = 100;
        player.resetPos();
      } else {
        alert(`❌ Game Over for ${name}! All 3 lives lost. Resetting entire game to Level 1.`);
        p1.fullReset();
        p2.fullReset();
        initLevel(1);
      }
    }

    function update() {
      p1.update();
      p2.update();

      const now = Date.now();

      // Moving traps updates
      traps.forEach(trap => {
        trap.x += trap.vx;
        trap.y += trap.vy;
        if (trap.x < 0 || trap.x > canvas.width - trap.size) trap.vx *= -1;
        if (trap.y < 0 || trap.y > canvas.height - trap.size) trap.vy *= -1;

        // Player 1 damage check (Only take damage if NOT protected)
        if (now >= p1.protectEndTime && checkCollision(p1, {x: trap.x + trap.size/2, y: trap.y + trap.size/2, radius: trap.size/2})) {
          p1.hp -= 2;
          playSound(130, 0.05);
          if (p1.hp <= 0) handlePlayerDeath(p1, "Player 1");
        }
        // Player 2 damage check (Only take damage if NOT protected)
        if (now >= p2.protectEndTime && checkCollision(p2, {x: trap.x + trap.size/2, y: trap.y + trap.size/2, radius: trap.size/2})) {
          p2.hp -= 2;
          playSound(130, 0.05);
          if (p2.hp <= 0) handlePlayerDeath(p2, "Player 2");
        }
      });

      // Treasure collection with dynamic points & pitch
      treasures.forEach((t, index) => {
        if (checkCollision(p1, t)) {
          p1.score += t.points;
          playSound(500 + t.points * 4, 0.08);
          treasures.splice(index, 1);
        } else if (checkCollision(p2, t)) {
          p2.score += t.points;
          playSound(500 + t.points * 4, 0.08);
          treasures.splice(index, 1);
        }
      });

      // Level progression
      if (treasures.length === 0) {
        if (currentLevel < 3) {
          alert(`Level ${currentLevel} cleared! Advancing to Level ${currentLevel + 1}!`);
          initLevel(currentLevel + 1);
        } else {
          alert(`🎉 Victory! Game Complete!\nFinal Scores:\nPlayer 1: ${p1.score}\nPlayer 2: ${p2.score}`);
          p1.fullReset();
          p2.fullReset();
          initLevel(1);
        }
      }

      // Update HUD Display
      document.getElementById('p1-score').innerText = p1.score;
      document.getElementById('p1-hp').innerText = Math.max(0, Math.floor(p1.hp));
      document.getElementById('p1-lives').innerText = p1.lives;
      
      document.getElementById('p2-score').innerText = p2.score;
      document.getElementById('p2-hp').innerText = Math.max(0, Math.floor(p2.hp));
      document.getElementById('p2-lives').innerText = p2.lives;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw static obstacles
      staticObstacles.forEach(obs => {
        ctx.fillStyle = '#555555';
        ctx.strokeStyle = '#777777';
        ctx.lineWidth = 2;

        if (obs.type === 'rect') {
          ctx.fillRect(obs.x, obs.y, obs.size, obs.size);
          ctx.strokeRect(obs.x, obs.y, obs.size, obs.size);
        } else if (obs.type === 'circle') {
          ctx.beginPath();
          ctx.arc(obs.x + obs.size/2, obs.y + obs.size/2, obs.size/2, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        } else if (obs.type === 'triangle') {
          ctx.beginPath();
          ctx.moveTo(obs.x + obs.size/2, obs.y);
          ctx.lineTo(obs.x + obs.size, obs.y + obs.size);
          ctx.lineTo(obs.x, obs.y + obs.size);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
      });

      // Draw treasures with their specific colors and sizes
      treasures.forEach(t => {
        ctx.fillStyle = t.color;
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });

      // Draw traps
      traps.forEach(t => {
        ctx.fillStyle = '#ff3333';
        ctx.fillRect(t.x, t.y, t.size, t.size);
        ctx.strokeStyle = '#990000';
        ctx.strokeRect(t.x, t.y, t.size, t.size);
      });

      // Draw players
      p1.draw();
      p2.draw();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    initLevel(1);
    gameLoop();
  </script>
</body>
</html>
