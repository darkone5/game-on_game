<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2-Player Treasure Hunt</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    h1 { margin-bottom: 5px; color: #ffd700; }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 1000px;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .p1-color { color: #00d2ff; }
    .p2-color { color: #00ff88; }
    canvas {
      border: 4px solid #444;
      background-color: #2b261f;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }
    .controls {
      margin-top: 15px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <h1>🏴‍☠️ 2-Player Treasure Hunt</h1>
  
  <div class="hud">
    <div class="p1-color">
      Player 1 (WASD)<br>
      Score: <span id="p1-score">0</span> | HP: <span id="p1-hp">100</span> | Lives: <span id="p1-lives">3</span>
    </div>
    <div>Level: <span id="level-display">1</span> / 3</div>
    <div class="p2-color" style="text-align: right;">
      Player 2 (Arrows)<br>
      Score: <span id="p2-score">0</span> | HP: <span id="p2-hp">100</span> | Lives: <span id="p2-lives">3</span>
    </div>
  </div>

  <canvas id="gameCanvas" width="1000" height="650"></canvas>

  <div class="controls">
    P1: <b>W, A, S, D</b> to move | P2: <b>Arrow Keys</b> to move
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Audio Context Setup
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    // Input state
    const keys = {};
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    // Game state variables
    let currentLevel = 1;
    let treasures = [];
    let traps = [];
    let staticObstacles = [];

    // Player class with lives & HP system
    class Player {
      constructor(x, y, color, controls) {
        this.startX = x;
        this.startY = y;
        this.x = x;
        this.y = y;
        this.size = 26;
        this.color = color;
        this.speed = 4.5;
        this.score = 0;
        this.hp = 100;
        this.lives = 3;
        this.controls = controls;
      }

      resetPos() {
        this.x = this.startX;
        this.y = this.startY;
      }

      fullReset() {
        this.score = 0;
        this.hp = 100;
        this.lives = 3;
        this.resetPos();
      }

      update() {
        let dx = 0;
        let dy = 0;

        if (keys[this.controls.up]) dy -= this.speed;
        if (keys[this.controls.down]) dy += this.speed;
        if (keys[this.controls.left]) dx -= this.speed;
        if (keys[this.controls.right]) dx += this.speed;

        this.x += dx;
        if (this.x < 0 || this.x > canvas.width - this.size || checkObstacleCollision(this)) {
          this.x -= dx;
        }

        this.y += dy;
        if (this.y < 0 || this.y > canvas.height - this.size || checkObstacleCollision(this)) {
          this.y -= dy;
        }
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x + this.size/2, this.y + this.size/2, this.size/2, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#fff';
        ctx.stroke();
      }
    }

    const p1 = new Player(100, 312, '#00d2ff', { up: 'w', down: 's', left: 'a', right: 'd' });
    const p2 = new Player(870, 312, '#00ff88', { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' });

    function checkPointObstacleCollision(x, y, radius) {
      for (let obs of staticObstacles) {
        if (obs.type === 'rect') {
          if (x + radius > obs.x && x - radius < obs.x + obs.size &&
              y + radius > obs.y && y - radius < obs.y + obs.size) {
            return true;
          }
        } else if (obs.type === 'circle') {
          const dx = x - (obs.x + obs.size/2);
          const dy = y - (obs.y + obs.size/2);
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < radius + obs.size/2) return true;
        } else if (obs.type === 'triangle') {
          if (x + radius > obs.x && x - radius < obs.x + obs.size &&
              y + radius > obs.y && y - radius < obs.y + obs.size) {
            return true;
          }
        }
      }
      return false;
    }

    function initLevel(lvl) {
      currentLevel = lvl;
      document.getElementById('level-display').innerText = currentLevel;
      p1.resetPos();
      p2.resetPos();

      // 1. Generate static obstacles first
      staticObstacles = [];
      const obstacleCount = 3 + lvl * 2;
      const shapes = ['rect', 'circle', 'triangle'];

      for (let i = 0; i < obstacleCount; i++) {
        const shape = shapes[Math.floor(Math.random() * shapes.length)];
        staticObstacles.push({
          type: shape,
          x: Math.random() * (canvas.width - 150) + 100,
          y: Math.random() * (canvas.height - 150) + 50,
          size: Math.random() * 30 + 25
        });
      }

      // 2. Generate treasures ensuring they DO NOT spawn inside obstacles
      treasures = [];
      const treasureCount = 6 + lvl * 2;
      for (let i = 0; i < treasureCount; i++) {
        let tX, tY, overlapping;
        let attempts = 0;
        do {
          tX = Math.random() * (canvas.width - 60) + 30;
          tY = Math.random() * (canvas.height - 60) + 30;
          overlapping = checkPointObstacleCollision(tX, tY, 9);
          attempts++;
          if (attempts > 200) break; // fallback safety
        } while (overlapping);

        treasures.push({
          x: tX,
          y: tY,
          radius: 9
        });
      }

      // 3. Moving Traps / Enemies
      traps = [];
      if (lvl === 2) {
        for (let i = 0; i < 4; i++) {
          traps.push({
            x: Math.random() * (canvas.width - 80) + 40,
            y: Math.random() * (canvas.height - 80) + 40,
            vx: (Math.random() - 0.5) * 3,
            vy: (Math.random() - 0.5) * 3,
            size: 20
          });
        }
      } else if (lvl === 3) {
        for (let i = 0; i < 8; i++) {
          traps.push({
            x: Math.random() * (canvas.width - 80) + 40,
            y: Math.random() * (canvas.height - 80) + 40,
            vx: (Math.random() - 0.5) * 4.5,
            vy: (Math.random() - 0.5) * 4.5,
            size: 22
          });
        }
      }
    }

    function checkCollision(circle1, circle2) {
      const dx = (circle1.x + circle1.size/2) - circle2.x;
      const dy = (circle1.y + circle1.size/2) - circle2.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      return distance < (circle1.size/2 + (circle2.radius || circle2.size/2));
    }

    function checkObstacleCollision(player) {
      for (let obs of staticObstacles) {
        const pCenterX = player.x + player.size / 2;
        const pCenterY = player.y + player.size / 2;
        const pRadius = player.size / 2;

        if (obs.type === 'rect') {
          if (pCenterX + pRadius > obs.x && pCenterX - pRadius < obs.x + obs.size &&
              pCenterY + pRadius > obs.y && pCenterY - pRadius < obs.y + obs.size) {
            return true;
          }
        } else if (obs.type === 'circle') {
          const dx = pCenterX - (obs.x + obs.size/2);
          const dy = pCenterY - (obs.y + obs.size/2);
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < pRadius + obs.size/2) return true;
        } else if (obs.type === 'triangle') {
          if (pCenterX + pRadius > obs.x && pCenterX - pRadius < obs.x + obs.size &&
              pCenterY + pRadius > obs.y && pCenterY - pRadius < obs.y + obs.size) {
            return true;
          }
        }
      }
      return false;
    }

    function handlePlayerDeath(player, name) {
      player.lives--;
      playSound(100, 0.1);
      if (player.lives > 0) {
        alert(`${name} lost a life! Lives remaining: ${player.lives}`);
        player.hp = 100;
        player.resetPos();
      } else {
        alert(`❌ Game Over for ${name}! All 3 lives lost. Resetting entire game to Level 1.`);
        p1.fullReset();
        p2.fullReset();
        initLevel(1);
      }
    }

    function update() {
      p1.update();
      p2.update();

      // Moving traps updates
      traps.forEach(trap => {
        trap.x += trap.vx;
        trap.y += trap.vy;
        if (trap.x < 0 || trap.x > canvas.width - trap.size) trap.vx *= -1;
        if (trap.y < 0 || trap.y > canvas.height - trap.size) trap.vy *= -1;

        if (checkCollision(p1, trap)) {
          p1.hp -= 2;
          playSound(130, 0.05);
          if (p1.hp <= 0) handlePlayerDeath(p1, "Player 1");
        }
        if (checkCollision(p2, trap)) {
          p2.hp -= 2;
          playSound(130, 0.05);
          if (p2.hp <= 0) handlePlayerDeath(p2, "Player 2");
        }
      });

      // Treasure collection
      treasures.forEach((t, index) => {
        if (checkCollision(p1, t)) {
          p1.score += 10;
          playSound(650, 0.08);
          treasures.splice(index, 1);
        } else if (checkCollision(p2, t)) {
          p2.score += 10;
          playSound(650, 0.08);
          treasures.splice(index, 1);
        }
      });

      // Level progression
      if (treasures.length === 0) {
        if (currentLevel < 3) {
          alert(`Level ${currentLevel} cleared! Advancing to Level ${currentLevel + 1}!`);
          initLevel(currentLevel + 1);
        } else {
          alert(`🎉 Victory! Game Complete!\nFinal Scores:\nPlayer 1: ${p1.score}\nPlayer 2: ${p2.score}`);
          p1.fullReset();
          p2.fullReset();
          initLevel(1);
        }
      }

      // Update HUD Display
      document.getElementById('p1-score').innerText = p1.score;
      document.getElementById('p1-hp').innerText = Math.max(0, Math.floor(p1.hp));
      document.getElementById('p1-lives').innerText = p1.lives;
      
      document.getElementById('p2-score').innerText = p2.score;
      document.getElementById('p2-hp').innerText = Math.max(0, Math.floor(p2.hp));
      document.getElementById('p2-lives').innerText = p2.lives;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas
